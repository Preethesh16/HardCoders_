name: optiwork-fabric-ca

x-ca: &ca
  image: ${FABRIC_CA_IMAGE}
  command: ["sh", "-c", "exec fabric-ca-server start -b \"$${FABRIC_CA_SERVER_BOOTSTRAP_USER_PASS}\""]
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD-SHELL", "fabric-ca-client getcainfo -u https://localhost:7054 --tls.certfiles /etc/hyperledger/fabric-ca-server/tls-cert.pem >/dev/null 2>&1"]
    interval: 3s
    timeout: 5s
    retries: 30
  networks: [optiwork-fabric]

services:
  ca-orderer:
    <<: *ca
    container_name: optiwork-ca-orderer
    hostname: ca.orderer.optiwork.local
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-orderer
      FABRIC_CA_SERVER_PORT: "7054"
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_CSR_HOSTS: ca.orderer.optiwork.local,localhost
      FABRIC_CA_SERVER_BOOTSTRAP_USER_PASS: admin:${ORDERER_CA_ADMIN_PASSWORD}
    ports: ["127.0.0.1:13054:7054"]
    volumes: ["./generated/ca/orderer:/etc/hyperledger/fabric-ca-server", "./generated:/work"]
  ca-buyer:
    <<: *ca
    container_name: optiwork-ca-buyer
    hostname: ca.buyer.optiwork.local
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-buyer
      FABRIC_CA_SERVER_PORT: "7054"
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_CSR_HOSTS: ca.buyer.optiwork.local,localhost
      FABRIC_CA_SERVER_BOOTSTRAP_USER_PASS: admin:${BUYER_CA_ADMIN_PASSWORD}
    ports: ["127.0.0.1:14054:7054"]
    volumes: ["./generated/ca/buyer:/etc/hyperledger/fabric-ca-server", "./generated:/work"]
  ca-seller:
    <<: *ca
    container_name: optiwork-ca-seller
    hostname: ca.seller.optiwork.local
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-seller
      FABRIC_CA_SERVER_PORT: "7054"
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_CSR_HOSTS: ca.seller.optiwork.local,localhost
      FABRIC_CA_SERVER_BOOTSTRAP_USER_PASS: admin:${SELLER_CA_ADMIN_PASSWORD}
    ports: ["127.0.0.1:15054:7054"]
    volumes: ["./generated/ca/seller:/etc/hyperledger/fabric-ca-server", "./generated:/work"]

networks:
  optiwork-fabric:
    external: true
    name: ${COMPOSE_NETWORK_NAME}
