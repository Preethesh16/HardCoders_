# Isolated OptiWork local acceptance stack. Hyperledger peers/orderer are
# managed by blockchain/fabric/network/network.sh under separate Docker project
# names; this stack joins only the dedicated optiwork-fabric-local network.
name: optiwork-local

services:
  postgres:
    image: pgvector/pgvector:pg17
    profiles: [data, local, full]
    environment:
      POSTGRES_USER: optiwork
      POSTGRES_PASSWORD: optiwork-local-development
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes: [optiwork-postgres:/var/lib/postgresql/data, ./postgres/init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiwork -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [data, local, full]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: optiwork
      MINIO_ROOT_PASSWORD: optiwork-local-development
    ports: ["127.0.0.1:${MINIO_PORT:-19100}:9000", "127.0.0.1:${MINIO_CONSOLE_PORT:-19101}:9001"]
    volumes: [optiwork-minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: [data, local, full]
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 optiwork optiwork-local-development &&
      mc mb --ignore-existing local/optiwork-documents && mc anonymous set none local/optiwork-documents"

  fabric-gateway:
    profiles: [local, full]
    image: node:24-bookworm-slim
    working_dir: /workspace/services/fabric-gateway
    command: ["node", "dist/server.js"]
    user: "1000:1000"
    env_file: [../.optiwork/localnet/fabric-gateway.env]
    environment:
      APP_MODE: demo
      FABRIC_MODE: real
      HOST: 0.0.0.0
      PORT: 4200
      FABRIC_CHANNEL_NAME: optiwork-channel
      FABRIC_CHAINCODE_NAME: optiwork-evidence
      IDEMPOTENCY_STORE: postgres
      IDEMPOTENCY_DATABASE_URL: postgresql://optiwork:optiwork-local-development@postgres:5432/optiwork_gateway
      IDEMPOTENCY_AUTO_MIGRATE: "true"
    ports: ["127.0.0.1:${FABRIC_GATEWAY_PORT:-4200}:4200"]
    volumes:
      - ../node_modules:/workspace/node_modules:ro
      - ../packages/contracts:/workspace/packages/contracts:ro
      - ../services/fabric-gateway/dist:/workspace/services/fabric-gateway/dist:ro
      - ../services/fabric-gateway/migrations:/workspace/services/fabric-gateway/migrations:ro
      - ../services/fabric-gateway/node_modules:/workspace/services/fabric-gateway/node_modules:ro
      - ../services/fabric-gateway/package.json:/workspace/services/fabric-gateway/package.json:ro
      - ../blockchain/fabric/network/generated/organizations:/fabric:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [default, optiwork-fabric]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  algorand-executor:
    profiles: [local, full]
    image: node:24-bookworm-slim
    working_dir: /workspace/services/algorand-executor
    command: ["node", "dist/server.js"]
    user: "1000:1000"
    env_file: [../.optiwork/localnet/algorand-executor.env]
    environment:
      HOST: 0.0.0.0
      PORT: 4301
      DATABASE_URL: postgresql://optiwork:optiwork-local-development@postgres:5432/optiwork_executor
      DATABASE_SSL_MODE: disable
      DATABASE_AUTO_MIGRATE: "true"
      FABRIC_GATEWAY_URL: http://fabric-gateway:4200
      FABRIC_GATEWAY_DEMO_AUTH: "true"
      FABRIC_EVIDENCE_MODE: gateway
      ALGORAND_NETWORK: localnet
      ALGORAND_ALGOD_URL: http://host.docker.internal:4001
      ALGORAND_ALGOD_TOKEN: ${ALGORAND_ALGOD_TOKEN:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      ALGORAND_CONFIRMATION_ROUNDS: "1"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ../node_modules:/workspace/node_modules:ro
      - ../services/algorand-executor/dist:/workspace/services/algorand-executor/dist:ro
      - ../services/algorand-executor/migrations:/workspace/services/algorand-executor/migrations:ro
      - ../services/algorand-executor/node_modules:/workspace/services/algorand-executor/node_modules:ro
      - ../services/algorand-executor/package.json:/workspace/services/algorand-executor/package.json:ro
    ports: ["127.0.0.1:${EXECUTOR_PORT:-4301}:4301"]
    depends_on:
      postgres: {condition: service_healthy}
      fabric-gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4301/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    profiles: [local, full]
    image: node:24-bookworm-slim
    working_dir: /workspace/apps/api
    command: ["node", "dist/server.js"]
    user: "1000:1000"
    env_file: [../.optiwork/localnet/api.env]
    environment:
      OPTIWORK_PROFILE: demo
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://optiwork:optiwork-local-development@postgres:5432/optiwork_api
      AUTH_MODE: demo
      STORAGE_MODE: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: optiwork-documents
      S3_ACCESS_KEY_ID: optiwork
      S3_SECRET_ACCESS_KEY: optiwork-local-development
      FX_MODE: fixture
      AI_MODE: fixture
      ALGORAND_MODE: executor
      ALGORAND_NETWORK: localnet
      ALGORAND_EXECUTOR_URL: http://algorand-executor:4301
      ALGORAND_DEPLOYMENT_MANIFEST_PATH: /run/optiwork/algorand-deployment.json
      FABRIC_MODE: gateway
      FABRIC_GATEWAY_URL: http://fabric-gateway:4200
      FABRIC_GATEWAY_AUTH_MODE: demo
    ports: ["127.0.0.1:${API_PORT:-4000}:4000"]
    volumes:
      - ../node_modules:/workspace/node_modules:ro
      - ../packages/contracts:/workspace/packages/contracts:ro
      - ../packages/domain:/workspace/packages/domain:ro
      - ../apps/api/dist:/workspace/apps/api/dist:ro
      - ../apps/api/migrations:/workspace/apps/api/migrations:ro
      - ../apps/api/node_modules:/workspace/apps/api/node_modules:ro
      - ../apps/api/package.json:/workspace/apps/api/package.json:ro
      - ../.optiwork/localnet/algorand-deployment.json:/run/optiwork/algorand-deployment.json:ro
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      fabric-gateway: {condition: service_healthy}
      algorand-executor: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    profiles: [local, full]
    image: node:24-bookworm-slim
    working_dir: /app
    command: ["node", "apps/web/server.js"]
    user: "1000:1000"
    environment:
      NODE_ENV: production
      PORT: 3000
      OPTIWORK_API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${API_PORT:-4000}
      NEXT_PUBLIC_ALGORAND_EXPLORER_BASE_URL: http://127.0.0.1:8980
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    volumes:
      - ../apps/web/.next/standalone:/app:ro
      - ../apps/web/.next/static:/app/apps/web/.next/static:ro
      - ../apps/web/public:/app/apps/web/public:ro
    depends_on:
      api: {condition: service_healthy}

  marketing:
    profiles: [local, full]
    image: node:24-bookworm-slim
    working_dir: /workspace/apps/marketing
    command: ["node", "serve.mjs"]
    user: "1000:1000"
    environment:
      HOST: 0.0.0.0
      PORT: 4175
      OPTIWORK_API_BASE_URL: http://api:4000
    ports: ["127.0.0.1:${MARKETING_PORT:-4175}:4175"]
    volumes:
      - ../apps/marketing:/workspace/apps/marketing:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4175/api/workflow/steps').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  optiwork-postgres:
  optiwork-minio:

networks:
  optiwork-fabric:
    external: true
    name: optiwork-fabric-local
