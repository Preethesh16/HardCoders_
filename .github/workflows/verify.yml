name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pinned pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          cache: true
          require-lockfile: true
      - name: Lint, typecheck, test and build
        run: pnpm verify

  fabric-chaincode:
    name: Fabric chaincode
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: blockchain/fabric/chaincode
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: blockchain/fabric/chaincode/go.mod
          cache-dependency-path: blockchain/fabric/chaincode/go.sum
      - name: Test evidence chaincode
        run: go test ./...
