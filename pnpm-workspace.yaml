packages:
  - apps/*
  - packages/*
  - services/*

# Native postinstall builds are opt-in. Only these three are approved, and each
# is a build-time toolchain rather than anything the running service loads.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  pkcs11js: false
  protobufjs: false
  unrs-resolver: true
